# Everything that can be checked without a Databricks workspace.
#
# The point of the split: a pull request from a fork has no access to repository
# secrets, so anything needing credentials cannot run there. The `test` job is
# therefore credential-free and is the one that gates every PR. `bundle` needs a
# real workspace and skips itself when the secrets are absent — a skipped job is
# honest; a job that fails on every fork PR trains people to ignore CI.
#
# `databricks bundle validate` is NOT an offline check. With `mode: development`
# it resolves root_path from ${workspace.current_user.userName}, which is a live
# SCIM call: pointed at a dummy host it fails with a DNS error rather than a
# validation result. The offline half of what it would catch — every resource
# path exists, every ${var.*} is declared, every ${resources.*} reference
# resolves — lives in tests/test_bundle_contracts.py and runs in the `test` job.
#
# What this would have caught, had it existed: a pipeline file using the legacy
# `dlt` API, a dashboard tile pinned to the wrong widget version, a field named
# `constructor`, an expectation naming a column its staged view does not emit,
# and a workspace host hardcoded into databricks.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit, contract and bundle-structure tests
        run: pytest

      - name: Expectation pre-flight
        run: python3 scripts/check_expectations.py

      - name: Shell scripts parse
        run: bash -n scripts/*.sh

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Secrets are unavailable to fork PRs, so decide here rather than letting
      # the CLI fail on an empty host. Step-level `if` can read the secrets
      # context; job-level `if` cannot.
      - id: creds
        run: echo "present=${{ secrets.DATABRICKS_HOST != '' && secrets.DATABRICKS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.creds.outputs.present == 'true'
        uses: databricks/setup-cli@main

      - name: Bundle validates against a real workspace
        if: steps.creds.outputs.present == 'true'
        run: databricks bundle validate --strict -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      - name: Explain the skip
        if: steps.creds.outputs.present != 'true'
        run: |
          echo "Skipped: DATABRICKS_HOST / DATABRICKS_TOKEN are not set."
          echo "bundle validate needs a live workspace — it resolves the current"
          echo "user over SCIM. The offline checks ran in the 'test' job."
