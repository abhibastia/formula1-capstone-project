# Second AI/BI dashboard: race pace and reliability.
#
# Kept separate from `f1_race_intelligence` rather than bolted on as two more
# pages, because it answers a different question. The first dashboard reports
# what happened — points, positions, conditions. This one asks why: who was
# quick on the day, and what stopped the cars that were.
#
# It is the only consumer of `gold.lap_pace`, the mart built on the finest grain
# in the project (one row per driver per lap). Same binding rules as the other
# dashboard: bare table names in the queries, catalog and schema attached here.

resources:
  dashboards:
    f1_pace_reliability:
      display_name: F1 Pace & Reliability
      file_path: ../dashboards/f1_pace_reliability.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: gold